# This file is part of the redpesk project.
include:
  - 'https://raw.githubusercontent.com/redpesk-devtools/gitlab-ci-factory-templates/refs/heads/master/rp-cli-template-ci.yml'

variables:
  RP_VERBOSE: "true"
  # Use a project-specific variable name here because RP_REMOTE_FACTORY_PROJECT
  # may be provided by GitLab project/group CI variables with higher precedence.
  RP_HELLOWORLD_FACTORY_PROJECT: "test-helloworld-binding"

stages:
  - lint
  - build
  - redtest

default:
  tags:
    - redpesk-binding-ci

lint:
  stage: lint
  script:
    - bash -x tests/ci/lint.sh
  allow_failure: true

build:
  stage: build
  extends:
    - .rp-cli-build
  script:
    # Force the project selected by this repository at shell runtime.
    - export RP_REMOTE_FACTORY_PROJECT="$RP_HELLOWORLD_FACTORY_PROJECT"
    - !reference [.rp-cli-build, script]

redtest:
  stage: redtest
  needs:
    - build
  extends:
    - .rp-cli-start-test
  script:
    # Use the same factory project as the build job.
    - export RP_REMOTE_FACTORY_PROJECT="$RP_HELLOWORLD_FACTORY_PROJECT"
    - '[ -n "$RP_DEBUG" ] && { set -x; rpcli connections current; }'
    - |
      TEST_TMO=${RP_TEST_TIMEOUT:-${RP_TEST_DEFAULT_TIMEOUT}}
      if [ -n "$RP_VERBOSE" ]; then
        echo "Variables status:"
        echo "RP_REMOTE_FACTORY_NAME:     ${RP_REMOTE_FACTORY_NAME}"
        echo "RP_REMOTE_FACTORY_URL:      ${RP_REMOTE_FACTORY_URL}"
        echo "RP_REMOTE_FACTORY_PROJECT:  ${RP_REMOTE_FACTORY_PROJECT}"
        echo "RP_REMOTE_FACTORY_APP:      ${RP_REMOTE_FACTORY_APP}"
        echo "RP_TEST_TIMEOUT:            ${TEST_TMO}"
      fi
    - |
      if [ -n "$RP_REMOTE_FACTORY_APP" ]; then
        APP_NAME="$RP_REMOTE_FACTORY_APP"
      else
        APP_NAME="$CI_PROJECT_NAME"
      fi
      echo "Using application name: $APP_NAME"
    - rp-cli applications test "$APP_NAME" --project "${RP_REMOTE_FACTORY_PROJECT}" --time-out ${TEST_TMO}
    - mkdir -p redtest-logs
    - rp-cli applications tests logs "$APP_NAME" --project "${RP_REMOTE_FACTORY_PROJECT}" --force-app --directory redtest-logs
    - cat redtest-logs/console.log
